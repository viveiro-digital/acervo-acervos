<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="monospace" font-size="12" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Proposta A — índice visual editorial (baixa fidelidade)</title>
  <rect width="800" height="620" fill="#f3ede2"/>
  <text x="24" y="30" font-size="14" font-weight="bold">A · ÍNDICE VISUAL EDITORIAL</text>
  <line x1="24" y1="44" x2="776" y2="44" stroke="#1c1a17"/>
  <!-- filtros -->
  <rect x="24" y="60" width="150" height="540" fill="none" stroke="#1c1a17" stroke-dasharray="4 3"/>
  <text x="34" y="80">filtros</text><text x="34" y="98">(recolhíveis</text><text x="34" y="114">no celular)</text>
  <!-- entrada 1: imagem vertical na proporção original -->
  <rect x="194" y="60" width="210" height="270" fill="#d9cdb8" stroke="#1c1a17"/>
  <text x="206" y="196">imagem licenciada</text><text x="206" y="212">proporção original</text>
  <text x="206" y="346" fill="#5a544b">legenda · crédito · licença · fonte</text>
  <rect x="424" y="60" width="350" height="16" fill="#1c1a17"/><text x="424" y="96">território · tipo</text>
  <rect x="424" y="106" width="300" height="10" fill="#5a544b"/><rect x="424" y="122" width="320" height="10" fill="#5a544b"/>
  <text x="424" y="150" fill="#2340a6">[estado] acesso · mantém · data</text>
  <line x1="194" y1="366" x2="776" y2="366" stroke="#1c1a17"/>
  <!-- entrada 2: prancha tipográfica (sem imagem autorizada) -->
  <rect x="194" y="382" width="210" height="150" fill="none" stroke="#1c1a17"/>
  <text x="206" y="402" fill="#2340a6">IMAGEM · PDF</text>
  <text x="206" y="432" font-size="16" font-weight="bold">título da amostra</text>
  <text x="206" y="500" fill="#5a544b">por que não há imagem</text>
  <text x="206" y="518" fill="#5a544b">ver na fonte ↗</text>
  <rect x="424" y="382" width="350" height="16" fill="#1c1a17"/>
  <rect x="424" y="410" width="300" height="10" fill="#5a544b"/>
  <text x="424" y="448" fill="#2340a6">[estado] acesso · mantém · data</text>
  <text x="194" y="590" fill="#a8361a">clique no título → painel lateral (URL do registro; Esc/voltar fecha)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
