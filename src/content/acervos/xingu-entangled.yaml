alternative_names: [Emaranhados do Xingu]
initiative_type: projeto-de-pesquisa
description:
  pt: >-
    Interface experimental que conecta vídeos, diagramas, desenhos, fotografias e
    palavras-chave em narrativas não lineares sobre cultura material do povo
    Kuikuro, do Alto Xingu, e sobre coleções etnográficas em museus.
