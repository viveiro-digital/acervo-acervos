initiative_type: diretorio
self_description:
  text: "Mapeo de la producción tipográfica en Latinoamérica"
  lang: es
  source_url: https://tipomap.lat/
description:
  pt: >-
    O Tipomap mapeia quem desenha e publica fontes tipográficas na América Latina. A base
    ajuda a encontrar profissionais e fundidoras por país e a identificar fontes com suporte
    a línguas indígenas.
