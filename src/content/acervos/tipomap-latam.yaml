  evidence: caminhos-de-arquivos
  note: Sem meta generator; um único script próprio (/assets/js/main.js). Não encontramos API pública.
  checked_at: "2026-11-22"
holdings_extent:
  - statement: "924 fichas encontradas en el nodo BR"
    scope: nó Brasil
    basis: declarado-pela-fonte
