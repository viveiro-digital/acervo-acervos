id: museu-maguta
name: "Museu Magüta"
initiative_type: museu
description:
  pt: >-
    O Magüta nasceu da organização do povo Ticuna no Alto Solimões, em meio à luta pelo
    reconhecimento de seus territórios. Os Ticuna administram o museu e participaram da
    formação do acervo. No site, cantos da Festa da Moça Nova e fotografias de atividades do
    povo Ticuna registram práticas e saberes escolhidos pelo próprio povo para contar sua
    história.
