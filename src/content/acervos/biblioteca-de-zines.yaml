sample:
  title: "Visagens no meio do mundo — Coletivo Ventos do Norte (2026)"
  level_of_description:
    value: item
    declared_by_source: false
  observed: >-
    Página do zine com o PDF renderizado no visualizador embutido (capa
    visível), descrição, categorias (Terror, Autobiográfico) e créditos: zine
    produzido por estudantes de Letras da UEAP (Amapá), segundo a ficha.
  confirmed_media: [pdf]
  creator: Coletivo Ventos do Norte
  date: "2026"
stewardship_or_host:
  type: independente
  note: >-
    Projeto gratuito e de código aberto, segundo a página Sobre; o código está
    em repositório público no GitHub.
  source_url: https://www.biblioteca-de-zines.com.br/about
community_evidence:
  kind: participacao
  note: >-
    Quem faz zines pode enviar suas publicações por formulário aberto. O Clube de
    Zines propõe temas mensais e convida quem participa a compartilhar o que fez.
  source_url: https://www.biblioteca-de-zines.com.br/zines-club
curatorial_reason:
  pt: >-
    Ao reunir publicações enviadas por suas autorias, a biblioteca dá acesso a
    zines que circulam fora das grandes editoras. A coleção inclui trabalhos do
    Norte, como o zine do Coletivo Ventos do Norte, feito no Amapá.
evidence:
  - claim: Autodescrição como biblioteca virtual de código aberto para zines independentes.
    source_url: https://www.biblioteca-de-zines.com.br/
    accessed_at: "2026-11-21"
    kind: declarado
    certainty: alta
  - claim: O PDF do zine da amostra renderiza no visualizador embutido.
    source_url: https://www.biblioteca-de-zines.com.br/zines/coletivo-ventos-do-norte-visagens-no-meio-do-mundo
    accessed_at: "2026-11-21"
    kind: observado
    certainty: alta
  - claim: O formulário permite enviar zines ao acervo e o Clube convida participantes a enviar as publicações dos encontros.
    source_url: https://www.biblioteca-de-zines.com.br/zines-club
    accessed_at: "2026-11-22"
    kind: declarado
    certainty: alta
access_level: player-externo
access_requirements: Nenhum cadastro; leitura via Google Drive embutido.
