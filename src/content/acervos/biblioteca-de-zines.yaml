id: biblioteca-de-zines
name: Biblioteca de Zines
preferred_name: Biblioteca de Zines
alternative_names: [Biblioteca Brasileira de Zines]
initiative_type: biblioteca
self_description:
  text: "Uma biblioteca virtual e código aberto para catalogar e arquivar iniciativas independentes em formato de zine"
  lang: pt
  source_url: https://www.biblioteca-de-zines.com.br/
description:
  pt: >-
    Acervo digital, comunitário e open source de zines brasileiras.
    A biblioteca recebe publicações pelo formulário aberto, organiza o Clube de
    Zines e disponibiliza os PDFs para leitura gratuita.
initiative_url: https://www.biblioteca-de-zines.com.br/
digital_collection_url: https://www.biblioteca-de-zines.com.br/zines
